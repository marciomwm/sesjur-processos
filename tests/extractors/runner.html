<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Testes dos extratores</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13.5px;
               margin: 0; padding: 24px; background: #f7f9fb; color: #1c2530; }
        h1 { font-size: 18px; margin: 0 0 4px; color: #12304d; }
        p.sub { color: #6b7a89; margin: 0 0 18px; font-size: 12.5px; max-width: 80ch; }
        .resumo { display:inline-block; padding: 8px 14px; border-radius: 6px; font-weight: 650;
                  margin-bottom: 18px; border: 1px solid; }
        .resumo.ok { background:#e6f4ec; border-color:#b6ddc6; color:#145c39; }
        .resumo.falha { background:#fbeaea; border-color:#eec4c4; color:#a4282c; }
        .caso { background:#fff; border:1px solid #dde4ea; border-left-width:3px; border-radius:6px;
                padding:12px 14px; margin-bottom:12px; }
        .caso.passou { border-left-color:#1f7a4d; }
        .caso.falhou { border-left-color:#a4282c; }
        .caso h3 { font-size: 13.5px; margin: 0 0 8px; }
        ul { margin:0; padding-left:18px; }
        li { margin: 2px 0; }
        li.ok { color:#145c39; }
        li.falha { color:#a4282c; font-weight:600; }
        pre { background:#f2f5f8; padding:10px; border-radius:4px; overflow-x:auto; font-size:11.5px; }
        details { margin-top:8px; }
        summary { cursor:pointer; color:#1f5b94; font-size:12px; }
    </style>
</head>
<body>
    <h1>Testes dos extratores — SIGADOC e PJe</h1>
    <p class="sub">
        Executa os extratores reais da extensão contra as fixtures de DOM.
        Abra esta página por HTTP (ex.: <code>php -S localhost:8080 -t .</code> na raiz do projeto),
        pois <code>fetch</code> de arquivos locais é bloqueado pelo navegador em <code>file://</code>.
    </p>
    <div id="resumo" class="resumo">executando…</div>
    <div id="resultados"></div>

    <script src="../../chrome-extension/config/selectors.js"></script>
    <script src="../../chrome-extension/extractors/dom-utils.js"></script>
    <script src="../../chrome-extension/extractors/normalizers.js"></script>
    <script src="../../chrome-extension/extractors/sigadoc-extractor.js"></script>
    <script src="../../chrome-extension/extractors/pje-extractor.js"></script>
    <script src="../../chrome-extension/extractors/pje-documentos.js"></script>
    <script src="casos.js"></script>
    <script src="runner.js"></script>
</body>
</html>
